name: Update public work snapshot
on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-work-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch public metadata and validate static SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_metrics.py
      - name: Commit a changed snapshot
        run: |
          set -euo pipefail
          git add -- assets/metrics-light.svg assets/metrics-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public work snapshot'
          git push origin HEAD:main
